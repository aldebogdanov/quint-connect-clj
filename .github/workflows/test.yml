name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # the only way the Apalache job below runs

jobs:
  # The fast suite is the one that must never be allowed to rot: it replays
  # committed traces and needs no Quint, which is the whole claim of the
  # two-phase split. If this job ever needs a tool installed, that claim broke.
  replay:
    name: replay only (no quint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
          clj-kondo: latest

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('deps.edn') }}
          restore-keys: m2-

      - run: clj-kondo --lint src test dev examples build.clj

      - run: bb test

  # Everything that shells out to quint. Excludes ^:slow, which runs Apalache.
  generate:
    name: with quint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned: the fixtures are recordings of this version, and a newer Quint
      # changing its ITF output is exactly the drift the tests exist to catch.
      # Bump it deliberately, with the fixtures, not by floating.
      - run: npm i -g @informalsystems/quint@0.32.0

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('deps.edn') }}
          restore-keys: m2-

      - run: bb test:all

      - run: cd examples/counter && clojure -M:test
      - run: cd examples/lru && clojure -M:test

  # Apalache: downloaded on first use and minutes per run, so it is not on the
  # path of an ordinary pull request. Run it by hand before a release.
  verify:
    name: verify (apalache)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm i -g @informalsystems/quint@0.32.0

      - run: bb test:verify
